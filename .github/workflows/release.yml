name: Release

# Push a tag that matches manifest.json's version (for example 0.1.0, no "v") to build and publish a release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip "topic-research-folders-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css "topic-research-folders-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css "topic-research-folders-${GITHUB_REF_NAME}.zip" \
              --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
          fi
